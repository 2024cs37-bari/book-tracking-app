name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Fetch pinned external corpus
        env:
          BOOK_CORPUS_DIR: ${{ runner.temp }}/book-tracking-corpus-v1
        run: npm run corpus:fetch

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser reader checks
        run: npm run test:browser

      - name: Real-file and mobile-sized reader checks
        env:
          BOOK_CORPUS_DIR: ${{ runner.temp }}/book-tracking-corpus-v1
        run: npm run test:corpus

      - name: Retain reader measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-measurements
          path: test-results/**/attachments/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
